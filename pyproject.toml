[project]
name = "dcm-mini-viewer"
version = "0.2.0"
description = "A discovery project for DICOM file viewing"
authors = [{ name = "Stuart Swerdloff", email = "sjswerdloff@gmail.com" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "PySide6>=6.4.0,<6.9",
    "pydicom>=2.4.4,<3",
    "numpy",
]

[project.scripts]
dcm-mini-viewer = "dcm_mini_viewer.main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<8",
    "pytest-qt>=4.2.0,<5",
    "pytest-cov>=4.1.0,<5",
    "pytest-mock>=3.14.0,<4",
    "pre-commit>=3.5.0,<4",
    "pyinstaller>=6.13.0,<7",
    "ruff>=0.15",
]

# Tooling-only parity with poetry.lock (Refs #1). Constraints hold the exact
# versions from poetry.lock; the declaration keeps Poetry's caret meaning.
# Bumps belong in #2, deliberately, one cause at a time.
[tool.uv]
constraint-dependencies = [
    "altgraph==0.17.4",
    "cfgv==3.4.0",
    "click==8.2.0",
    "colorama==0.4.6",
    "coverage==7.8.0",
    "dill==0.4.0",
    "distlib==0.3.9",
    "exceptiongroup==1.3.0",
    "filelock==3.18.0",
    "identify==2.6.10",
    "iniconfig==2.1.0",
    "macholib==1.16.3",
    "nodeenv==1.9.1",
    "numpy==2.2.5",
    "packaging==25.0",
    "pefile==2023.2.7",
    "platformdirs==4.3.8",
    "pluggy==1.5.0",
    "pydicom==2.4.4",
    "pyinstaller==6.13.0",
    "pyinstaller-hooks-contrib==2025.4",
    "PySide6==6.8.3",
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-mock==3.14.0",
    "pytest-qt==4.4.0",
    "pywin32-ctypes==0.2.3",
    "pyyaml==6.0.2",
    "setuptools==80.4.0",
    "shiboken6==6.8.3",
    "tomli==2.2.1",
    "typing-extensions==4.13.2",
    "virtualenv==20.31.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dcm_mini_viewer"]

[tool.ruff]
line-length = 127
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["dcm_mini_viewer"]
