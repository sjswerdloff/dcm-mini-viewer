# Gitea CI (#6), on our self-hosted Mac Studio runner. .github/workflows/ stays for GitHub's
# hosted runners; Gitea reads .gitea/workflows/ in preference to it.
# Actions are pinned by commit SHA with the tag in a comment.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
defaults:
  run:
    shell: /opt/homebrew/bin/bash -eo pipefail {0}
jobs:
  gates:
    runs-on: stuart-m3ultra-canary
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Homebrew first on PATH
        run: |
          echo /opt/homebrew/sbin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: uv (Homebrew's; installed once if this runner lacks it)
        run: |
          command -v uv > /dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install uv
          echo "uv: $(command -v uv) -> $(uv --version)"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint with ruff
        run: uv run --locked ruff check dcm_mini_viewer/
      - name: Check formatting with ruff
        run: uv run --locked ruff format --check dcm_mini_viewer/
      - name: Test with pytest
        run: uv run --locked pytest test/
