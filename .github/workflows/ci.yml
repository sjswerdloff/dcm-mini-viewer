name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint with ruff
        run: uv run ruff check dcm_mini_viewer/
      - name: Check formatting with ruff
        run: uv run ruff format --check dcm_mini_viewer/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: install ubuntu packages (only if xvfb is missing and sudo works)
        run: |
          command -v xvfb-run && echo "xvfb already available" && exit 0
          sudo -n apt-get update && sudo -n apt-get install -y xvfb libxkbcommon-x11-0 libxcb-cursor0 || echo "sudo not available or xvfb not needed (offscreen mode)"
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Test with pytest
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: uv run pytest --cov=dcm_mini_viewer --cov-report=xml --cov-report=term test/

  build:
    runs-on: ${{ matrix.os }}
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Build with PyInstaller
        run: uv run pyinstaller dcm_mini_viewer/main.py --name dcm-mini-viewer --onefile
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dcm-mini-viewer-${{ matrix.os }}
          path: dist/
